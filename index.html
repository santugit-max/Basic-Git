<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Netflix Clone</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<nav class="navbar">
		<img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo" class="logo">
		<ul class="nav-links">
			<li>Home</li>
			<li>TV Shows</li>
			<li>Movies</li>
			<li>Latest</li>
			<li>My List</li>
		</ul>
		<div class="profile"></div>
	</nav>
	<header class="hero">
		<div class="hero-content">
			<h1>Stranger Things</h1>
			<p>When a young boy vanishes, a small town uncovers a mystery involving secret experiments, terrifying supernatural forces and one strange little girl.</p>
			<div class="hero-buttons">
				<button>Play</button>
				<button>My List</button>
			</div>
		</div>
	</header>
	<section class="row">
		<h2>Trending Now</h2>
		<div class="row-posters">
			<img src="https://image.tmdb.org/t/p/w500/8Y43POKjjKDGI9MH89NW0NAzzp8.jpg" alt="Movie 1">
			<img src="https://image.tmdb.org/t/p/w500/6DrHO1jr3qVrViUO6s6kFiAGM7.jpg" alt="Movie 2">
			<img src="https://image.tmdb.org/t/p/w500/9O1Iy9od7uQ6yJz1gZ3v1XwQp1o.jpg" alt="Movie 3">
			<img src="https://image.tmdb.org/t/p/w500/4q2NNj4S5dG2RLF9CpXsej7yXl.jpg" alt="Movie 4">
			<img src="https://image.tmdb.org/t/p/w500/6agKYU5IQFpuDyUYPu39w7UCRrJ.jpg" alt="Movie 5">
			<img src="https://image.tmdb.org/t/p/w500/2CAL2433ZeIihfX1Hb2139CX0pW.jpg" alt="Movie 6">
			<img src="https://image.tmdb.org/t/p/w500/velWPhVMQeQKcxggNEU8YmIo52R.jpg" alt="Movie 7">
			<img src="https://image.tmdb.org/t/p/w500/5KCVkau1HEl7ZzfPsKAPM0sMiKc.jpg" alt="Movie 8">
			<img src="https://image.tmdb.org/t/p/w500/6FfCtAuVAW8XJjZ7eWeLibRLWTw.jpg" alt="Movie 9">
			<img src="https://image.tmdb.org/t/p/w500/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg" alt="Movie 10">
		</div>
	</section>
</body>
</html>
